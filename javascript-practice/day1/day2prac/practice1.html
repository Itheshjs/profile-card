<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>user age validation</h2>
    <input type="text" id="name" placeholder="enter the name">
    <input type="number" id="age" placeholder="enter the age">


    <button onclick="checkLogin()">Cheak</button>
    <h3 id="result"></h3>
</body>
<script>

    function checkLogin(){
    let name=document.getElementById("name").value;

    let age=document.getElementById("age").value;

    let result=document.getElementById("result");


    if(age>=18){
        result.innerHTML=name+"you eligible to vote"+age;
        result.style.color="white";
        result.style.background="green";
    }
    else{
        result.innerHTML=name+"your not eligible to vote"+age;
    }
}
</script>
</html>
