<script>
let num = 121;
let rev = 0;
let temp = num;

while (temp > 0) {
    let digit = temp % 10;
    rev = rev * 10 + digit;
    temp = Math.floor(temp / 10);
}

if (num === rev) {
    console.log("Palindrome");
} else {
    console.log("Not Palindrome");
}
</script>
